[package]
name = "echomoss"
version = "0.2.0"
description = "A quiet native Spotify companion that grows a pixel terrarium."
authors = ["Avexzz"]
license = "MIT"
edition = "2021"

[lib]
name = "echomoss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tiny_http = "0.12"
url = "2"
webbrowser = "1"


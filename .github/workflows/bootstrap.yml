name: Bootstrap echomoss source

on:
  push:
    branches:
      - main
    paths:
      - ".github/bootstrap/READY"

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project tree
        shell: bash
        run: |
          set -euo pipefail
          cat .github/bootstrap/part-* | base64 --decode > "$RUNNER_TEMP/echomoss.zip"
          unzip -q "$RUNNER_TEMP/echomoss.zip" -d "$RUNNER_TEMP/echomoss"
          cp -a "$RUNNER_TEMP/echomoss/echomoss/." .
          rm -rf .github/bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit published source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: launch echomoss native Spotify companion"
          git push
